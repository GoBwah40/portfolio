name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26 # LTS actif
          cache: npm

      - run: npm ci

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Code inutilisé (knip)
        run: npm run knip

      - name: Tests
        run: npm test

      # Bloque sur les failles hautes ou critiques des dépendances de production.
      - name: Audit de sécurité
        run: npm audit --omit=dev --audit-level=high

      # Aucune variable d'environnement : le build ne doit pas dépendre de secrets.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
